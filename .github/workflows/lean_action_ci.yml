name: Lean CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check architecture source graph and Python tooling
        run: |
          python -m py_compile tools/architecture/generate_baseline.py tools/architecture/check_compatibility.py tools/architecture/check_layout.py tools/architecture/check_phase.py tools/architecture/check_phase_projection.py tools/architecture/check_completion_phase_projection.py tools/architecture/check_completion_phase.py tools/architecture/check_warnings.py tools/architecture/check_lint.py tools/architecture/check_provenance.py tools/architecture/normalize_apache_notices.py tools/architecture/sort_aggregate_imports.py tools/benchmark/run.py
          python tools/architecture/check_phase.py --self-test
          python tools/architecture/check_phase_projection.py --self-test
          python tools/architecture/check_completion_phase_projection.py --self-test
          python tools/architecture/check_completion_phase.py --self-test
          python tools/architecture/check_warnings.py --self-test
          python tools/architecture/check_lint.py --self-test
          python tools/architecture/check_phase.py --all-phases
          python tools/architecture/check_completion_phase.py
          python tools/architecture/check_layout.py
          python tools/architecture/check_tiers.py --self-test
          python tools/architecture/check_tiers.py
          python tools/architecture/check_placeholders.py --self-test
          python tools/architecture/check_placeholders.py
          python tools/architecture/check_compatibility.py
          python tools/architecture/check_provenance.py
          python tools/architecture/generate_baseline.py --skip-declarations --strict-source --output-dir benchmark-results/ci-architecture --name source
      - name: Build library and smoke tests
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: --quiet NumStability NumStabilityTest
          test: false
          lint: false
      - name: Run lake test
        run: lake test
      - name: Check the warning baseline
        id: warning_baseline
        continue-on-error: true
        run: |
          set -o pipefail
          {
            printf '##[group]lake build NumStability NumStabilityTest\n'
            printf '[command]/usr/bin/git log -1 --format=%%H\n'
            git log -1 --format=%H
            lean --version
          } | tee "$RUNNER_TEMP/lean-build.log"
          lake build NumStability NumStabilityTest 2>&1 | tee -a "$RUNNER_TEMP/lean-build.log"
          printf '##[endgroup]\n' | tee -a "$RUNNER_TEMP/lean-build.log"
          PYTHONIOENCODING=utf-8 python tools/architecture/check_placeholders.py --completion --log "$RUNNER_TEMP/lean-build.log"
          python tools/architecture/check_warnings.py --log "$RUNNER_TEMP/lean-build.log" --baseline docs/architecture/warnings.json --check
      - name: Check the lint baseline
        id: lint_baseline
        continue-on-error: true
        run: |
          lake lint 2>&1 | tee "$RUNNER_TEMP/lean-lint.log" || true
          PYTHONIOENCODING=utf-8 python tools/architecture/check_lint.py --log "$RUNNER_TEMP/lean-lint.log" --baseline docs/architecture/lint.json --check
      - name: Upload diagnostic logs
        if: ${{ always() && steps.lint_baseline.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-diagnostic-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lean-build.log
            ${{ runner.temp }}/lean-lint.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce diagnostic baselines
        if: ${{ always() && steps.lint_baseline.outcome != 'skipped' }}
        env:
          WARNING_OUTCOME: ${{ steps.warning_baseline.outcome }}
          LINT_OUTCOME: ${{ steps.lint_baseline.outcome }}
        run: |
          if [[ "$WARNING_OUTCOME" != "success" || "$LINT_OUTCOME" != "success" ]]; then
            echo "warning baseline: $WARNING_OUTCOME"
            echo "lint baseline: $LINT_OUTCOME"
            exit 1
          fi
